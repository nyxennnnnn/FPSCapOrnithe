
name: Build Custom FPS Cap

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      - name: Generate Minecraft sources
        run: gradle genSources

      - name: Compile mod
        run: gradle build

      - name: Collect Minecraft sources
        run: |
          mkdir -p generated-sources
          find . -path '*/minecraftMaven/net/minecraft/minecraft-merged/*-sources.jar' -exec cp {} generated-sources/ \;
          ls -lh generated-sources

      - name: Upload Minecraft sources
        uses: actions/upload-artifact@v6
        with:
          name: MinecraftSources
          path: generated-sources/*.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: CustomFPSCap
          path: build/libs/*.jar
